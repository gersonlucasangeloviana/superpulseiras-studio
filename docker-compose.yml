services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-studio}
      POSTGRES_DB: ${POSTGRES_DB:-studio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [private]

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-studio}:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-studio}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-astra}
      OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-gpt-image-2.5-sunburst}
      STUDIO_PASSWORD: ${STUDIO_PASSWORD:?Defina STUDIO_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET:?Defina SESSION_SECRET}
      APP_ORIGIN: ${APP_ORIGIN:?Defina APP_ORIGIN}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      DATA_DIR: /app/data
    volumes:
      - studio_images:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 30s
    stop_grace_period: 30s
    networks: [private]

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    restart: unless-stopped
    expose: ["3000"]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 8s
      retries: 5
    # O Traefik do Dokploy acessa este serviço pela rede externa. A porta
    # permanece apenas exposta entre containers; configure o domínio na UI do
    # Dokploy para o serviço `frontend`, porta 3000 e caminho `/`.
    networks: [private, dokploy-network]

volumes:
  postgres_data:
  studio_images:

networks:
  private:
    driver: bridge
  # Rede criada e administrada pelo Dokploy. Não é criada por este Compose.
  dokploy-network:
    external: true
